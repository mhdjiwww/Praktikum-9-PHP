<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body { 
            font-family: Arial, Helvetica, sans-serif; 
            background: #f4f4f4; 
            margin: 0; 
            padding: 40px 0; 
        }
        .container { 
            max-width: 400px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 25px 30px; 
            border-radius: 8px; 
            box-shadow: 0 2px 6px rgba(0,0,0,.2); 
        }
        h2 { 
            margin-top: 0; 
        }
        label.judul { 
            display: block; 
            font-weight: bold; 
            margin: 15px 0 6px; 
        }
        input[type="text"], input[type="date"] { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        .hobi label { 
            display: block; 
            margin: 4px 0; }

        button { 
            margin-top: 20px; 
            background: #007bff; 
            color: #fff; border: none; 
            padding: 10px 18px; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { 
            background: #0069d9; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Formulir Data Diri</h2>
        <form action="proses_data_diri.php" method="POST">
            <label class="judul" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>

            <label class="judul" for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

            <label class="judul">Hobi:</label>
            <div class="hobi">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>
</body>
</html>
